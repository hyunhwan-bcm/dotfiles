# SSH config for Tailscale nodes. Shared across machines via dotfiles.
#
# Pulled in by this line in ~/.ssh/config (install.sh adds it):
#     Include ~/.config/ssh/tailnet.conf
#
# Host names match the yazi vfs.toml names, so `ssh studio` and
# `yazi sftp://studio` mean the same machine and user.
#
# Auth comes from the SSH agent ($SSH_AUTH_SOCK): the 1Password agent on
# macOS, or the forwarded agent when you are already on a tailnet box.

Host studio
    HostName studio.tail5aee49.ts.net
    User 2katz

Host diginda diginda-spark
    HostName diginda-spark.tail5aee49.ts.net
    User hyunhwan

Host jani jani-spark
    HostName jani-spark.tail5aee49.ts.net
    User hyunhwan

Host anjanda
    HostName anjanda.tail5aee49.ts.net
    User hyunhwan

Host hwan-pro-liulab
    HostName hwan-pro-liulab.tail5aee49.ts.net
    User hyunhwanj

Host mbp-2katz
    HostName 2katzs-macbook-pro.tail5aee49.ts.net
    User hyunhwanj

# Applies to every alias above plus anything else on the tailnet.
Host studio diginda diginda-spark jani jani-spark anjanda hwan-pro-liulab mbp-2katz *.tail5aee49.ts.net
    ForwardAgent yes
    ServerAliveInterval 30
    ServerAliveCountMax 4
    StrictHostKeyChecking accept-new
