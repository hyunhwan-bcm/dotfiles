# SSH config for Tailscale nodes. Shared across machines via dotfiles.
#
# Pulled in by this line in ~/.ssh/config (install.sh adds it):
#     Include ~/.config/ssh/tailnet.conf
#
# Host names match the yazi vfs.toml names, so `ssh studio` and
# `yazi sftp://studio` mean the same machine and user.
#
# HostName is the Tailscale IP (stable per node) because MagicDNS is not
# enabled on this tailnet, so *.ts.net names do not resolve.
#
# Auth comes from the SSH agent ($SSH_AUTH_SOCK): the 1Password agent on
# macOS, or the forwarded agent when you are already on a tailnet box.

Host studio
    HostName 100.77.133.77   # studio.tail5aee49.ts.net
    User 2katz

Host diginda diginda-spark
    HostName 100.65.65.47   # diginda-spark.tail5aee49.ts.net
    User hyunhwan

Host jani jani-spark
    HostName 100.84.51.102   # jani-spark.tail5aee49.ts.net
    User hyunhwan

Host anjanda
    HostName 100.103.101.49   # anjanda.tail5aee49.ts.net
    User hyunhwan

Host hwan-pro-liulab
    HostName 100.84.234.122   # hwan-pro-liulab.tail5aee49.ts.net
    User hyunhwanj

Host mbp-2katz
    HostName 100.117.151.126   # 2katzs-macbook-pro.tail5aee49.ts.net
    User hyunhwanj

# Applies to every alias above plus anything else on the tailnet.
Host studio diginda diginda-spark jani jani-spark anjanda hwan-pro-liulab mbp-2katz 100.*
    ForwardAgent yes
    ServerAliveInterval 30
    ServerAliveCountMax 4
    StrictHostKeyChecking accept-new
