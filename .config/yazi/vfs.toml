# Yazi virtual filesystems: one SFTP provider per Tailscale node.
# Docs: https://yazi-rs.github.io/docs/configuration/vfs
#
# Open one with `yazi sftp://<name>` or the `g` + <Key> chords in keymap.toml.
# Absolute remote paths: sftp://studio//Users/2katz/Downloads
#
# Auth: no key_file / password here on purpose. Yazi uses $SSH_AUTH_SOCK, which
# .zshrc points at the 1Password SSH agent on macOS and which is the forwarded
# agent when you are logged into a Linux box over ssh (ForwardAgent is on for
# tailnet hosts in ~/.config/ssh/tailnet.conf). One key, stored in 1Password,
# never written to disk on any machine.
#
# Hosts are Tailscale IPs (stable per node) so this works even where MagicDNS
# is not resolving. Same file is shared by every machine via dotfiles; the
# entry for the machine you are on is harmless.

